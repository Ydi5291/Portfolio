<div class="home-page-shell">
	<div class="container home-content">
		<header id="hero" class="hero">
			<div class="hero-layout">
				<div class="hero-text">
					<h1 class="hero-name">Youssouf Diallo</h1>
					<h2 class="hero-role">{{ copy().heroRole }}</h2>
					<p class="hero-intro muted">{{ copy().heroIntro }}</p>
					<span class="hero-meta" aria-live="polite">
						<img [src]="currentHeroMeta.icon" alt="" width="20" height="20" decoding="async">
						<span>{{ currentHeroMeta.text }}</span>
					</span>
				</div>

				<div class="hero-media" aria-hidden="true">
					<img
						class="profile-photo"
						src="assets/images/Youssouf.jpg"
						alt=""
						width="220"
						height="220"
						decoding="async"
						fetchpriority="high"
					> 
				</div>

				<div class="hero-actions">
					<div class="cta-row">
						<a class="btn btn-primary" routerLink="/cv">{{ copy().cvCta }}</a>
					</div>
				</div>
			</div>
		</header>

		<div class="landing-stack">
			<section id="why" class="home-section section-shell">
				<div class="why-layout">
					<h2 appRevealOnScroll class="section-title section-title-main why-title slide-bottom">{{ copy().whyTitle }}</h2>
					<div appRevealOnScroll class="why-bubble slide-bottom reveal-delay-1">
						@for (paragraph of copy().whyParagraphs; track paragraph) {
							<p>{{ paragraph }}</p>
						}
					</div>
				</div>
			</section>

			<section id="about" class="home-section section-shell">
				<app-about [embedded]="true"></app-about>
			</section>

			<section id="projects" class="home-section section-shell">
				<app-projects [embedded]="true"></app-projects>
			</section>

			<app-contact-section></app-contact-section>
		</div>
	</div>
</div>

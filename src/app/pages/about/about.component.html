<section class="about-intro">
	<h2 class="section-title-main">{{ copy().title }}</h2>
</section>

<section class="story-grid" aria-label="Background and focus">
	<article class="story-card story-bubble">
		<div class="section-heading">
			<p class="section-kicker">{{ copy().journeyEyebrow }}</p>
			<h3>{{ copy().journeyTitle }}</h3>
		</div>
		<ul class="timeline">
			@for (item of copy().journeyItems; track item.label) {
				<li>
					<span class="timeline-label">{{ item.label }}</span>
					<p>{{ item.text }}</p>
				</li>
			}
		</ul>
	</article>

	<aside class="stack-panel daily-stack" aria-label="Daily stack">
		<p class="section-kicker">{{ copy().stackTitle }}</p>
		<h3>Daily tools</h3>
		<ul class="badges">
			@for (item of copy().stackItems; track item) {
				<li class="badge">{{ item }}</li>
			}
		</ul>
	</aside>
</section>

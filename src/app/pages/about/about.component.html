<section appRevealOnScroll class="about-intro slide-bottom">
	<h2 class="section-title-main">{{ copy().title }}</h2>
</section>

<section class="story-grid" aria-label="Background and focus">
	<article appRevealOnScroll class="story-card story-bubble slide-bottom reveal-delay-1">
		<div class="section-heading">
			<h3>{{ copy().journeyTitle }}</h3>
		</div>
		<ul class="timeline">
			@for (item of copy().journeyItems; track item.label) {
				<li>
					<span class="timeline-label">{{ item.label }}</span>
					<p>{{ item.text }}</p>
				</li>
			}
		</ul>
	</article>

	<aside appRevealOnScroll class="stack-panel daily-stack slide-bottom reveal-delay-2" aria-label="Daily stack">
		<h3>{{ copy().stackTitle }}</h3>
		<ul class="badges">
			@for (item of copy().stackItems; track item) {
				<li class="badge">{{ item }}</li>
			}
		</ul>
	</aside>
</section>
